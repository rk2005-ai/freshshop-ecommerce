<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>All Products - Perishable Shop</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e3a8a">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.7.0/css/all.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .filter-sidebar {
            background: var(--bg-card);
            border-radius: var(--radius-md);
            padding: 20px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
        <div class="container">
            <a class="navbar-brand font-weight-bold d-flex align-items-center" href="index.html">
                <i class="fas fa-shopping-basket text-warning mr-2"></i>Perishable Shop
            </a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav mr-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item active"><a class="nav-link font-weight-bold" href="products.html">All Products</a></li>
                    <li class="nav-item"><a class="nav-link" href="bulk-order.html"><i class="fas fa-table text-warning mr-1"></i> Bulk Order</a></li>
                    <li class="nav-item"><a class="nav-link" href="admin.html"><i class="fas fa-chart-line text-info mr-1"></i> Admin</a></li>
                </ul>

                <ul class="navbar-nav align-items-center">
                    <li class="nav-item mr-2">
                        <button class="btn theme-btn" onclick="toggleTheme()" title="Toggle Dark/Light Mode">
                            <i class="theme-toggle-icon fas fa-moon"></i>
                        </button>
                    </li>
                    <li class="nav-item mr-2">
                        <a class="btn btn-outline-info btn-sm font-weight-bold" href="wallet.html">
                            <i class="fas fa-wallet mr-1"></i> <span class="wallet-balance-val">$150.00</span>
                        </a>
                    </li>
                    <li class="nav-item mr-2">
                        <a class="btn btn-outline-danger btn-sm position-relative" href="products.html?view=wishlist">
                            <i class="fas fa-heart"></i>
                            <span class="badge badge-danger wishlist-badge-count" style="display:none;">0</span>
                        </a>
                    </li>
                    <li class="nav-item mr-2">
                        <a class="btn btn-outline-light btn-sm font-weight-bold position-relative" href="cart.html">
                            <i class="fas fa-shopping-cart mr-1"></i> Cart
                            <span class="badge badge-warning text-dark cart-badge-count" style="display:none;">0</span>
                        </a>
                    </li>
                    <li class="nav-item"><a class="nav-link" href="orders.html"><i class="fas fa-box mr-1"></i> Orders</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container-fluid my-4 px-lg-5">
        <div class="row">
            <!-- Left: Sidebar Filters -->
            <div class="col-lg-3 mb-4">
                <div class="filter-sidebar">
                    <h5 class="font-weight-bold mb-3"><i class="fas fa-filter text-primary mr-2"></i>Filter & Search</h5>
                    
                    <!-- Search with Voice Mic -->
                    <div class="form-group mb-3">
                        <label class="font-weight-bold small text-muted">Search Keyword</label>
                        <div class="input-group">
                            <input type="text" class="form-control" id="catalogSearchInput" placeholder="e.g. Apple, Milk..." oninput="applyFilters()">
                            <div class="input-group-append">
                                <button class="btn btn-outline-secondary" type="button" onclick="startVoiceSearch('#catalogSearchInput')" title="Search by Voice">
                                    <i class="fas fa-microphone text-primary"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Category Filter -->
                    <div class="form-group mb-3">
                        <label class="font-weight-bold small text-muted">Category</label>
                        <select class="form-control" id="categoryFilter" onchange="applyFilters()">
                            <option value="All">All Categories</option>
                            <option value="Fruits">🍎 Fruits</option>
                            <option value="Vegetables">🥕 Vegetables</option>
                            <option value="Dairy">🥛 Dairy</option>
                            <option value="Bakery">🍞 Bakery</option>
                        </select>
                    </div>

                    <!-- Price Filter -->
                    <div class="form-group mb-3">
                        <label class="font-weight-bold small text-muted">Max Price: $<span id="priceLabel">10</span></label>
                        <input type="range" class="custom-range" id="priceRange" min="1" max="15" value="10" oninput="document.getElementById('priceLabel').innerText = this.value; applyFilters();">
                    </div>

                    <!-- Sort By -->
                    <div class="form-group mb-4">
                        <label class="font-weight-bold small text-muted">Sort By</label>
                        <select class="form-control" id="sortFilter" onchange="applyFilters()">
                            <option value="featured">Featured</option>
                            <option value="price_asc">Price: Low to High</option>
                            <option value="price_desc">Price: High to Low</option>
                            <option value="name_asc">Name: A to Z</option>
                        </select>
                    </div>

                    <button class="btn btn-outline-secondary btn-block btn-sm mb-2" onclick="resetFilters()">Reset Filters</button>
                    <a href="bulk-order.html" class="btn btn-outline-info btn-block btn-sm"><i class="fas fa-table mr-1"></i> Wholesale Bulk Matrix</a>
                </div>
            </div>

            <!-- Right: Product Grid -->
            <div class="col-lg-9">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h4 class="font-weight-bold mb-0" id="catalogHeading">Catalog Produce</h4>
                    <span class="text-muted small" id="matchCount">Showing items</span>
                </div>

                <div class="row" id="catalogGrid">
                    <!-- Products injected here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Floating Comparison Tray -->
    <div class="compare-dock" id="compareDock">
        <div>
            <i class="fas fa-balance-scale text-warning mr-2"></i>
            <strong><span id="compareCount">0</span> Item(s) Selected for Comparison</strong>
        </div>
        <div>
            <a href="compare.html" class="btn btn-warning btn-sm font-weight-bold px-3 mr-2">Compare Now</a>
            <button class="btn btn-sm btn-outline-light" onclick="localStorage.setItem('compareList', '[]'); renderCompareDock();">&times;</button>
        </div>
    </div>

    <!-- Native Mobile App Bottom Tab Bar (Mobile Only) -->
    <div class="mobile-bottom-nav">
        <a href="index.html" class="mobile-tab-item">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </a>
        <a href="products.html" class="mobile-tab-item active">
            <i class="fas fa-th-large"></i>
            <span>Browse</span>
        </a>
        <a href="cart.html" class="mobile-tab-item">
            <i class="fas fa-shopping-cart"></i>
            <span>Cart</span>
            <span class="mobile-tab-badge cart-badge-count" style="display:none;">0</span>
        </a>
        <a href="orders.html" class="mobile-tab-item">
            <i class="fas fa-box"></i>
            <span>Orders</span>
        </a>
        <a href="wallet.html" class="mobile-tab-item">
            <i class="fas fa-wallet"></i>
            <span>Wallet</span>
        </a>
    </div>

    <!-- Scripts -->
    <script src="js/app.js"></script>
    <script>
        function applyFilters() {
            const urlParams = new URLSearchParams(window.location.search);
            const isWishlistView = urlParams.get('view') === 'wishlist';
            const wishlist = JSON.parse(localStorage.getItem('wishlist') || '[]');

            const searchVal = document.getElementById('catalogSearchInput').value.toLowerCase().trim();
            const catVal = document.getElementById('categoryFilter').value;
            const maxPrice = parseFloat(document.getElementById('priceRange').value);
            const sortVal = document.getElementById('sortFilter').value;

            let products = getProducts();

            if (isWishlistView) {
                document.getElementById('catalogHeading').innerText = '❤️ My Saved Wishlist';
                products = products.filter(p => wishlist.includes(p.id));
            }

            let filtered = products.filter(p => {
                const matchSearch = p.name.toLowerCase().includes(searchVal) || p.description.toLowerCase().includes(searchVal);
                const matchCat = catVal === 'All' || p.category === catVal;
                const matchPrice = p.price <= maxPrice;
                return matchSearch && matchCat && matchPrice;
            });

            if (sortVal === 'price_asc') filtered.sort((a, b) => a.price - b.price);
            else if (sortVal === 'price_desc') filtered.sort((a, b) => b.price - a.price);
            else if (sortVal === 'name_asc') filtered.sort((a, b) => a.name.localeCompare(b.name));

            document.getElementById('matchCount').innerText = `Showing ${filtered.length} products`;
            const grid = document.getElementById('catalogGrid');

            if (filtered.length === 0) {
                grid.innerHTML = '<div class="col-12 text-center py-5 text-muted"><h4>No matching produce found.</h4><p>Try resetting filters or adjusting search terms.</p></div>';
                return;
            }

            let html = '';
            filtered.forEach(p => {
                html += `
                <div class="col-xl-3 col-lg-4 col-md-6 mb-4">
                    <div class="card product-card h-100">
                        <div class="product-img-wrap">
                            <span class="badge ${p.stock > 10 ? 'badge-success' : 'badge-warning'} badge-stock">
                                ${p.stock > 10 ? 'In Stock' : 'Low: ' + p.stock}
                            </span>
                            <button class="wish-btn" onclick="toggleWishlist(${p.id})">
                                <i class="far fa-heart"></i>
                            </button>
                            <img src="${p.image}" alt="${p.name}">
                        </div>
                        <div class="card-body p-3 d-flex flex-column">
                            <div class="d-flex justify-content-between align-items-center mb-1">
                                <small class="text-muted text-uppercase font-weight-bold">${p.category}</small>
                                <button class="btn btn-xs btn-outline-primary py-0 px-2 small" onclick="toggleCompare(${p.id}, '${p.name}')">
                                    <i class="fas fa-balance-scale mr-1"></i> Compare
                                </button>
                            </div>
                            <h6 class="card-title font-weight-bold mb-1">${p.name}</h6>
                            <p class="text-muted small text-truncate mb-2">${p.description}</p>
                            <div class="mt-auto pt-2 border-top d-flex align-items-center justify-content-between">
                                <h5 class="text-primary font-weight-bold mb-0">$${p.price}</h5>
                                <button class="btn btn-warning btn-sm font-weight-bold" onclick="addToCart(${p.id}, 1)">
                                    <i class="fas fa-cart-plus mr-1"></i> Add
                                </button>
                            </div>
                        </div>
                    </div>
                </div>`;
            });
            grid.innerHTML = html;
        }

        function resetFilters() {
            document.getElementById('catalogSearchInput').value = '';
            document.getElementById('categoryFilter').value = 'All';
            document.getElementById('priceRange').value = 10;
            document.getElementById('priceLabel').innerText = '10';
            document.getElementById('sortFilter').value = 'featured';
            applyFilters();
        }

        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const searchParam = urlParams.get('search');
            if (searchParam) {
                document.getElementById('catalogSearchInput').value = searchParam;
            }
            applyFilters();
        });
    </script>
    <script src="https://code.jquery.com/jquery-3.4.1.slim.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js"></script>
</body>
</html>
