<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Shopping Cart - Perishable Shop</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e3a8a">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.7.0/css/all.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .cart-card {
            background: var(--bg-card);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
        }
        .cart-item-img {
            width: 65px;
            height: 65px;
            object-fit: contain;
            border-radius: 8px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
        }
        .qty-box {
            display: inline-flex;
            align-items: center;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            overflow: hidden;
        }
        .qty-box button {
            padding: 4px 10px;
            background: var(--bg-secondary);
            border: none;
            cursor: pointer;
            font-weight: bold;
            color: var(--text-main);
        }
        .qty-box span {
            padding: 4px 12px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
        <div class="container">
            <a class="navbar-brand font-weight-bold" href="index.html"><i class="fas fa-shopping-basket text-warning mr-2"></i>Perishable Shop</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav mr-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="products.html">All Products</a></li>
                    <li class="nav-item"><a class="nav-link" href="bulk-order.html">Bulk Order</a></li>
                </ul>
                <ul class="navbar-nav align-items-center">
                    <li class="nav-item mr-2"><button class="btn theme-btn" onclick="toggleTheme()"><i class="theme-toggle-icon fas fa-moon"></i></button></li>
                    <li class="nav-item"><a class="btn btn-outline-info btn-sm font-weight-bold" href="wallet.html"><i class="fas fa-wallet mr-1"></i> <span class="wallet-balance-val">$150.00</span></a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container my-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="font-weight-bold mb-1"><i class="fas fa-shopping-cart text-primary mr-2"></i>My Shopping Cart</h2>
                <p class="text-muted mb-0">Review items, apply promo codes, and proceed to checkout</p>
            </div>
            <button class="btn btn-outline-danger btn-sm" onclick="clearCart(); renderCartPage();">
                <i class="fas fa-trash-alt mr-1"></i> Clear Cart
            </button>
        </div>

        <div id="cartContentWrap">
            <!-- Injected via JS -->
        </div>
    </div>

    <!-- Native Mobile App Bottom Tab Bar (Mobile Only) -->
    <div class="mobile-bottom-nav">
        <a href="index.html" class="mobile-tab-item">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </a>
        <a href="products.html" class="mobile-tab-item">
            <i class="fas fa-th-large"></i>
            <span>Browse</span>
        </a>
        <a href="cart.html" class="mobile-tab-item active">
            <i class="fas fa-shopping-cart"></i>
            <span>Cart</span>
            <span class="mobile-tab-badge cart-badge-count" style="display:none;">0</span>
        </a>
        <a href="orders.html" class="mobile-tab-item">
            <i class="fas fa-box"></i>
            <span>Orders</span>
        </a>
        <a href="wallet.html" class="mobile-tab-item">
            <i class="fas fa-wallet"></i>
            <span>Wallet</span>
        </a>
    </div>

    <!-- Scripts -->
    <script src="js/app.js"></script>
    <script>
        let appliedDiscount = 0;
        let appliedCouponCode = '';

        function renderCartPage() {
            const cart = getCart();
            const wrap = document.getElementById('cartContentWrap');

            if (cart.length === 0) {
                wrap.innerHTML = `
                <div class="card cart-card text-center py-5">
                    <div class="py-4">
                        <i class="fas fa-shopping-basket fa-4x text-muted mb-3"></i>
                        <h4>Your shopping cart is empty!</h4>
                        <p class="text-muted">Explore our fresh grocery catalog and add fresh produce to your cart.</p>
                        <a href="products.html" class="btn btn-primary btn-lg mt-2"><i class="fas fa-store mr-1"></i> Start Shopping</a>
                    </div>
                </div>`;
                return;
            }

            const subtotal = getCartSubtotal();
            const discountAmount = (subtotal * appliedDiscount);
            const finalTotal = Math.max(0, subtotal - discountAmount);

            let itemsHtml = '';
            cart.forEach(item => {
                itemsHtml += `
                <tr>
                    <td>
                        <div class="d-flex align-items-center">
                            <img src="${item.product.image}" alt="${item.product.name}" class="cart-item-img mr-3">
                            <div>
                                <h6 class="mb-0 font-weight-bold">${item.product.name}</h6>
                                <small class="text-muted">${item.product.category} | ${item.product.weight}g</small>
                            </div>
                        </div>
                    </td>
                    <td><strong>$${item.product.price}</strong></td>
                    <td>
                        <div class="qty-box">
                            <button onclick="updateCartQty(${item.product.id}, -1); renderCartPage();">-</button>
                            <span>${item.quantity}</span>
                            <button onclick="updateCartQty(${item.product.id}, 1); renderCartPage();">+</button>
                        </div>
                    </td>
                    <td><strong class="text-primary">$${item.subtotal}</strong></td>
                    <td>
                        <button class="btn btn-sm btn-outline-danger" onclick="removeFromCart(${item.product.id}); renderCartPage();">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </td>
                </tr>`;
            });

            wrap.innerHTML = `
            <div class="row">
                <div class="col-lg-8 mb-4">
                    <div class="card cart-card p-4">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="thead-light">
                                    <tr>
                                        <th>Product</th>
                                        <th>Price</th>
                                        <th>Quantity</th>
                                        <th>Subtotal</th>
                                        <th>Action</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${itemsHtml}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div class="col-lg-4">
                    <div class="card cart-card p-4 mb-4">
                        <h6 class="font-weight-bold mb-3"><i class="fas fa-ticket-alt text-warning mr-2"></i>Apply Promo Code</h6>
                        <div class="input-group">
                            <input type="text" class="form-control" id="couponInput" placeholder="Try SUPER30 or FRESH10" value="${appliedCouponCode}">
                            <div class="input-group-append">
                                <button class="btn btn-primary font-weight-bold" onclick="applyCoupon()">Apply</button>
                            </div>
                        </div>
                        <small class="text-muted mt-2 d-block">Available: <strong>SUPER30</strong> (30% off), <strong>FRESH10</strong> (10% off)</small>
                    </div>

                    <div class="card cart-card p-4">
                        <h5 class="font-weight-bold mb-3">Order Summary</h5>
                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-muted">Subtotal:</span>
                            <span class="font-weight-bold">$${subtotal.toFixed(2)}</span>
                        </div>
                        ${appliedDiscount > 0 ? `
                        <div class="d-flex justify-content-between mb-2 text-success">
                            <span>Discount (${appliedCouponCode}):</span>
                            <span class="font-weight-bold">-$${discountAmount.toFixed(2)}</span>
                        </div>` : ''}
                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-muted">Estimated Delivery:</span>
                            <span class="text-success font-weight-bold">FREE</span>
                        </div>
                        <hr>
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <h5 class="mb-0 font-weight-bold">Total:</h5>
                            <h3 class="mb-0 font-weight-bold text-primary">$${finalTotal.toFixed(2)}</h3>
                        </div>
                        <a href="checkout.html?discount=${appliedDiscount}&code=${appliedCouponCode}" class="btn btn-success btn-lg btn-block font-weight-bold py-3 shadow">
                            <i class="fas fa-lock mr-2"></i> Proceed to Checkout
                        </a>
                        <a href="products.html" class="btn btn-outline-secondary btn-block mt-2">Continue Shopping</a>
                    </div>
                </div>
            </div>`;
        }

        function applyCoupon() {
            const code = document.getElementById('couponInput').value.trim().toUpperCase();
            if (code === 'SUPER30') {
                appliedDiscount = 0.30;
                appliedCouponCode = 'SUPER30';
                showToast('Coupon SUPER30 applied! 30% discount deducted.', 'success');
            } else if (code === 'FRESH10') {
                appliedDiscount = 0.10;
                appliedCouponCode = 'FRESH10';
                showToast('Coupon FRESH10 applied! 10% discount deducted.', 'success');
            } else {
                appliedDiscount = 0;
                appliedCouponCode = '';
                showToast('Invalid coupon code. Try SUPER30 or FRESH10', 'error');
            }
            renderCartPage();
        }

        document.addEventListener('DOMContentLoaded', renderCartPage);
    </script>
    <script src="https://code.jquery.com/jquery-3.4.1.slim.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js"></script>
</body>
</html>
